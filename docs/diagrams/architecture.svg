<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 361" width="880" height="361" role="img" aria-label="agent-steddy sits between your Claude Code agents and your repo: it checks every prompt and command, blocks risky git and secret reads, and keeps what the agents learn in docs/agents. A lesson&#x27;s life: a mistake is recorded as a rule, the rule is recalled when its situation comes back, promoted when it repeats, and checked by an eval case.">
<title>agent-steddy sits between your Claude Code agents and your repo: it checks every prompt and command, blocks risky git and secret reads, and keeps what the agents learn in docs/agents. A lesson&#x27;s life: a mistake is recorded as a rule, the rule is recalled when its situation comes back, promoted when it repeats, and checked by an eval case.</title>
<style>
  .t{font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .s{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .lbl{font:12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .cmd{font:12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .row{font:500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.08em} .p{font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .ln{stroke-width:1.5;fill:none}
  .bg{fill:#F8F8F8} .node{fill:#FFFFFF;stroke:#E5E5E3} .hub{fill:#FFFFFF;stroke:#8C8F97} .t{fill:#1F1F21} .s{fill:#62656D} .lbl,.cmd{fill:#505258} .row{fill:#8C8F97} .ln{stroke:#9A9DA4} .hd{fill:#9A9DA4} .blue rect{fill:#CFE1FD;stroke:#357DE8} .blue text{fill:#123263} .green rect{fill:#D3F1A7;stroke:#5B7F24} .green text{fill:#37471F} .amber rect{fill:#FCE4A6;stroke:#C8894A} .amber text{fill:#693200} .grey rect{fill:#EBEBE9;stroke:#8C8F97} .grey text{fill:#292A2E} .red rect{fill:#FFD5D2;stroke:#E2483D} .red text{fill:#5D1F1A} .purple rect{fill:#EED7FC;stroke:#AF59E1} .purple text{fill:#48245D}
  @media (prefers-color-scheme: dark) { .bg{fill:#1F1F21} .node{fill:#242528;stroke:#34363A} .hub{fill:#242528;stroke:#7E8188} .t{fill:#E4E5E8} .s{fill:#9FA2A8} .lbl,.cmd{fill:#B6B8BC} .row{fill:#7E8188} .ln{stroke:#7E8188} .hd{fill:#7E8188} .blue rect{fill:#123263;stroke:#4688EC} .blue text{fill:#CFE1FD} .green rect{fill:#37471F;stroke:#82B536} .green text{fill:#D3F1A7} .amber rect{fill:#693200;stroke:#C8894A} .amber text{fill:#FCE4A6} .grey rect{fill:#2F3033;stroke:#7E8188} .grey text{fill:#CECFD2} .red rect{fill:#5D1F1A;stroke:#F15B50} .red text{fill:#FFD5D2} .purple rect{fill:#48245D;stroke:#BF63F3} .purple text{fill:#EED7FC} }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="880" height="361" rx="16"/>
<text class="row" x="28" y="40">HOW IT FITS</text>
<rect class="node" x="28.0" y="102.0" width="150.0" height="70" rx="12"/>
<text class="t" x="103.0" y="134.0" text-anchor="middle">You</text>
<text class="s" x="103.0" y="153.0" text-anchor="middle">give tasks, review</text>
<rect class="node" x="242.7" y="102.0" width="161.8" height="70" rx="12"/>
<text class="t" x="323.6" y="134.0" text-anchor="middle">Claude Code</text>
<text class="s" x="323.6" y="153.0" text-anchor="middle">main agent, subagents</text>
<rect class="hub" x="469.2" y="102.0" width="168.1" height="70" rx="12" stroke-width="1.5"/>
<text class="t" x="553.2" y="134.0" text-anchor="middle">agent-steddy</text>
<text class="s" x="553.2" y="153.0" text-anchor="middle">plugin in your project</text>
<rect class="node" x="702.0" y="60.0" width="150.0" height="70" rx="12"/>
<text class="t" x="777.0" y="92.0" text-anchor="middle">Your repo</text>
<text class="s" x="777.0" y="111.0" text-anchor="middle">safe commits only</text>
<rect class="node" x="702.0" y="144.0" width="150.0" height="70" rx="12"/>
<text class="t" x="777.0" y="176.0" text-anchor="middle">Lessons</text>
<text class="s" x="777.0" y="195.0" text-anchor="middle">docs/agents/</text>
<path class="ln" d="M184.0 137.0H236.7" marker-end="url(#a)"/>
