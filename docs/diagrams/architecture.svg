<text class="lbl" x="436.8" y="129.0" text-anchor="middle">checks</text>
<path class="ln" d="M643.3 116.0H696.0" marker-end="url(#a)"/>
<text class="lbl" x="669.7" y="108.0" text-anchor="middle">guards</text>
<path class="ln" d="M643.3 158.0H696.0" marker-end="url(#a)" marker-start="url(#a)"/>
<text class="lbl" x="669.7" y="150.0" text-anchor="middle">learns</text>
<text class="row" x="28" y="262">A LESSON&#x27;S LIFE</text>
<g class="red"><rect x="28.0" y="282" width="83.7" height="30" rx="15"/><text class="p" x="69.8" y="302" text-anchor="middle">Mistake</text></g>
<path class="ln" d="M121.7 297.0H205.0" marker-end="url(#a)"/>
<text class="lbl" x="163.3" y="323.0" text-anchor="middle">recorded</text>
<g class="amber"><rect x="215.0" y="282" width="60.7" height="30" rx="15"/><text class="p" x="245.3" y="302" text-anchor="middle">Rule</text></g>
<path class="ln" d="M285.7 297.0H369.0" marker-end="url(#a)"/>
<text class="lbl" x="327.3" y="323.0" text-anchor="middle">fits again</text>
<g class="blue"><rect x="379.0" y="282" width="91.4" height="30" rx="15"/><text class="p" x="424.7" y="302" text-anchor="middle">Recalled</text></g>
<path class="ln" d="M480.3 297.0H563.6" marker-end="url(#a)"/>
<text class="lbl" x="522.0" y="323.0" text-anchor="middle">repeats</text>
<g class="purple"><rect x="573.6" y="282" width="91.4" height="30" rx="15"/><text class="p" x="619.3" y="302" text-anchor="middle">Promoted</text></g>
<path class="ln" d="M675.0 297.0H758.3" marker-end="url(#a)"/>
<text class="lbl" x="716.7" y="323.0" text-anchor="middle">eval case</text>
<g class="green"><rect x="768.3" y="282" width="83.7" height="30" rx="15"/><text class="p" x="810.2" y="302" text-anchor="middle">Checked</text></g>
