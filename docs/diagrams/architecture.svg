<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 408" width="900" height="408" role="img" aria-label="agent-steddy: Claude Code fires its events at the plugin&#x27;s hooks, which read the project config and answer with deny, ask or block; the hooks keep a task clock and timings in local state under .git/agent-steddy; agents run the agent-steddy command, which reads the project config, keeps that clock and writes the project&#x27;s records under docs/agents; agents read the skills, and the templates are copied into the project&#x27;s agents and role cards.">
<title>agent-steddy: Claude Code fires its events at the plugin&#x27;s hooks, which read the project config and answer with deny, ask or block; the hooks keep a task clock and timings in local state under .git/agent-steddy; agents run the agent-steddy command, which reads the project config, keeps that clock and writes the project&#x27;s records under docs/agents; agents read the skills, and the templates are copied into the project&#x27;s agents and role cards.</title>
